# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
favicon                  : "/images/logo/favicon-320x320.png"
locale                   : "en-US"
title                    : "Henry YAN"
title_separator          : "-"
name                     : &name "Henry Yan"
description              : &description "Henry Yan — software engineering, applied AI, projects, and life beyond work."
url                      : https://yany-henry.me # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "YanY-Henry/yany-henry.github.io"
future                   : true
# SEO Related
google_site_verification : google491706b25e97ea09.html
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :  # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


# Analytics
analytics:
  provider               :  "google-analytics-4"
  google:
    tracking_id          : "G-G1LQKHL1KB"


visitor_map:
  enabled: true

# Site Author
author:
  name             : "Henry Yan"
  avatar           : "profile.jpg"
  bio              : "\"All human wisdom is contained in these two words,—'Wait and hope.'\" — Alexandre Dumas" 
  location         : "New York, USA"
  employer         : # "The Chinese University of Hong Kong"
  googlescholar    : # "http://yourfullgooglescholarurl.com"
  email            : "yy2373@cornell.edu"
  uri              :
  github           : "YanY-Henry"
  instagram        : "yyh_henry"
  linkedin         : "YanY-Henry"
  orcid            : "0009-0005-4274-7342"


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - certificates
  - Dockerfile
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Page defaults
# Experience entries are maintained directly in _pages.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
