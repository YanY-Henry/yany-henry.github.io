{% include base_path %}
<header class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-nav__brand" href="{{ base_path }}/">{{ site.title }}</a>
      <ul class="site-nav__links" id="navigation-links">
        {% for link in site.data.navigation.main %}
          <li><a href="{{ base_path }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
      <div class="site-nav__actions">
        <button class="icon-button theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme" aria-pressed="false">
          <svg class="theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.5 13.1A8.5 8.5 0 0 1 10.9 3.5 8.5 8.5 0 1 0 20.5 13.1Z"/></svg>
          <svg class="theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        </button>
        <button class="icon-button navigation-toggle" type="button" aria-label="Open navigation" aria-controls="navigation-links" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </nav>
  </div>
</header>
